<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique Login Page</title>
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <form>
          <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" /><br />
            <span id="errorMessage"></span>


          </div>
          <div class="input-group">
            <label>Password</label> 
            <input type="password" id="password" /><br />
            <span id="passwordMessage"></span> 


          </div>
          
            <button type="button" onclick="validate1(event)">Login</button>
        </form>
      </div>
    </div>
    <script>
      function validate1(event) {
          event.preventDefault();
          let a = document.getElementById("username").value;
          let b = document.getElementById("password").value;
          console.log(a)
       
        if (a.length == 0 || a.length < 4) {
          errorMessage.style.color = "red";
          errorMessage.innerText = "Username is required";
        } 
        else if (b.length == 0 || b.length < 4) {
          passwordMessage.style.color = "red";
          passwordMessage.innerText = "Password is required";
        } else {
          passwordMessage.style.color = "green";
          passwordMessage.innerText = "Password is validate sucessfully";
          window.location.href="/pages/mock.html"
        }
      }
    </script>
  </body>
</html>
